# Live copy: /etc/nginx/sites-enabled/reading.13lab.tech on `lab`.
# Certs issued with: certbot certonly --nginx -d readly.13lab.tech (same for reading.13lab.tech)

# readly.13lab.tech: the app
server {
    server_name readly.13lab.tech;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/readly.13lab.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/readly.13lab.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name readly.13lab.tech;
    return 301 https://readly.13lab.tech$request_uri;
}

# reading.13lab.tech: old domain, permanent redirect to readly
server {
    server_name reading.13lab.tech;
    return 301 https://readly.13lab.tech$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/reading.13lab.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reading.13lab.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name reading.13lab.tech;
    return 301 https://readly.13lab.tech$request_uri;
}
